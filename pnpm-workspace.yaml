# Install a flat (npm-style) node_modules tree instead of pnpm's symlinked
# virtual store. This app is packaged with electron-builder, whose file
# collectors can miss packages that live only under node_modules\.pnpm;
# native packages that ship per-platform binaries (onnxruntime-node here) are
# the ones at risk. A hoisted tree is the layout every collector understands.
# Not yet confirmed by a packaged build of this app.
#
# (This lives here rather than in .npmrc because pnpm 11 no longer reads
# node-linker from .npmrc.)
nodeLinker: hoisted
